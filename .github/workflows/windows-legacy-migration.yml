name: Windows legacy identity migration

on:
  workflow_dispatch:
  push:
    branches: [main, refactor]
  pull_request:
    paths:
      - "common/legacymigration/**"
      - "common/fileperm/**"
      - "common/atomicfile/**"
      - "internal/dirsecurity/**"
      - "common/settings/**"
      - "backend/**"
      - "account/**"
      - "ipc/**"
      - "cmd/lanternd/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/windows-legacy-migration.yml"

permissions:
  contents: read

concurrency:
  group: windows-legacy-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration:
    runs-on: windows-2025
    # The tests take ~3 minutes; a hung runner should surface fast and free
    # the concurrency slot.
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Exercise Windows migration authorization and recovery
        shell: pwsh
        run: |
          go test -v -tags with_clash_api ./internal/dirsecurity ./common/legacymigration ./common/atomicfile ./common/settings ./account ./backend ./ipc ./cmd/lanternd
          if ($LASTEXITCODE -ne 0) { throw 'Windows identity migration tests failed' }

  # The Windows job's own check status is occasionally lost after a successful
  # run. This job's status posts from a Linux runner once the run concludes
  # and lands reliably — gate branch protection on it, never on `migration`
  # directly.
  result:
    runs-on: ubuntu-latest
    needs: migration
    if: always()
    timeout-minutes: 5
    steps:
      - name: Report the migration job result
        env:
          MIGRATION_RESULT: ${{ needs.migration.result }}
        run: |
          echo "migration: $MIGRATION_RESULT"
          test "$MIGRATION_RESULT" = "success"
